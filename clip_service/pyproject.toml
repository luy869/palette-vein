[project]
name = "clip-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.0",
    "numpy<2",
    "torchvision==0.22.0",
    "open-clip-torch==2.24.0",
    "pillow==12.2.0",
    "requests==2.33.0",
    "grpcio==1.73.0",
    "grpcio-tools==1.73.0",
    "protobuf>=4.25",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
