[project]
name = "clip-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "open-clip-torch==2.24.0",
    "pillow==10.3.0",
    "requests==2.32.3",
    "grpcio==1.73.0",
    "grpcio-tools==1.73.0",
    "protobuf>=4.25",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
