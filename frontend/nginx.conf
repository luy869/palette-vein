server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # セキュリティヘッダ（クリックジャッキング・MIMEスニッフィング対策）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP: JS/CSSは自己ホスト、Reactのインラインstyle許可、画像はwallhaven許可、API接続は自己
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://th.wallhaven.cc https://w.wallhaven.cc data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
